name: Feature request
description: Something passkify should be able to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to build that passkify makes hard?
    validations: { required: true }

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: An API sketch is welcome, but the problem matters more.
    validations: { required: true }

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Including whether the low-level exports got you there.
