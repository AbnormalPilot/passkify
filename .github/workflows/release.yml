name: Release

on:
  push:
    tags: ['v*']

# Required for npm provenance: the OIDC token proves to the registry that this
# tarball was built by this workflow, from this commit.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # `prepublishOnly` runs typecheck and tests, which build dist/.
      - run: npm publish -w passkify
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
