name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  library:
    name: library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The test files import the compiled output, so dist/ has to exist before
      # anything type-checks it. `npm test` would build it, but that runs after.
      - run: npm run build -w passkify
      - run: npm run typecheck -w passkify
      # `test` rebuilds dist/, so this also proves the published output compiles.
      - run: npm test -w passkify

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify -w passkify-docs
